name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Generate and hash-verify Gate-B artifacts
        run: |
          python scripts/generate_development_v1.py
          sha256sum -c data/development/development_v1.sha256
      - name: Validate frozen blinded annotation packets
        run: python scripts/build_annotation_packets.py --validate-only
      - run: python -m pytest -q
      - run: PYTHONPATH=src python scripts/validate_dataset.py data/development/pilot_v0.jsonl
      - run: PYTHONPATH=src python scripts/validate_dataset.py data/development/development_v1.jsonl --require-raw-context
      - run: PYTHONPATH=src python scripts/audit_development_v1.py data/development/development_v1.jsonl data/development/development_v1.meta.jsonl
      - name: Exercise pre-human measurement controls
        run: |
          PYTHONPATH=src python scripts/shuffled_feature_control.py --packet annotation/packet_a.csv > /tmp/controls.json
          grep -q 'FRAMEWORK_PENDING_LABELS' /tmp/controls.json
          grep -q '"pass": true' /tmp/controls.json
      - name: Verify blocked report and gate decision
        run: |
          PYTHONPATH=src python scripts/generate_gate_b_report.py > /tmp/gate_b_report.json
          grep -q 'BLOCKED_BY_INDEPENDENT_ANNOTATION' /tmp/gate_b_report.json
          grep -q 'NOT EXECUTED' /tmp/gate_b_report.json
          test "$(PYTHONPATH=src python scripts/decide_gate_b.py)" = "GATE B — BLOCKED_BY_INDEPENDENT_ANNOTATION"
      - name: Verify pre-label Gate-B state remains blocked
        run: |
          test ! -e annotations/raw/annotator_a_v1.csv
          test ! -e annotations/raw/annotator_b_v1.csv
