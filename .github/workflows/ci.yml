name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Preserve Protocol-v1 deterministic artifacts
        run: |
          python scripts/generate_development_v1.py
          sha256sum -c data/development/development_v1.sha256
          python scripts/build_annotation_packets.py --validate-only
      - name: Preserve Protocol-v1 blocked verdict without fabricating humans
        run: |
          test "$(PYTHONPATH=src python scripts/decide_gate_b.py)" = "GATE B — BLOCKED_BY_INDEPENDENT_ANNOTATION"
          test ! -e annotations/raw/annotator_a_v1.csv
          test ! -e annotations/raw/annotator_b_v1.csv

      - name: Verify Gate-B upstream ancestry and normative immutability
        run: |
          git merge-base --is-ancestor 89e00052d68b2862269daf2adc8b31ebb1ae592c HEAD
          git diff --exit-code 89e00052d68b2862269daf2adc8b31ebb1ae592c HEAD -- spec/proactivity_policy_v2.json src/proactivity/specification
          test "$(sha256sum spec/proactivity_policy_v2.json | awk '{print $1}')" = "ea06eeb85ffa375740e778d273b57d79e7f4f96d0eb68eb74ed2ef9df6d827a4"
          test "$(sha256sum src/proactivity/specification/oracle.py | awk '{print $1}')" = "11ec7557d4809b18e1c414d9a3b0eaf95ad93ac7f771da11ed0cf4c3043bed2f"
      - name: Generate and hash-verify Protocol-v2 development transport set
        run: |
          PYTHONPATH=src python scripts/generate_development_v2.py
          sha256sum -c data/development/development_v2.sha256
          PYTHONPATH=src python scripts/validate_development_v2.py
      - name: Exhaustively validate Protocol-v2 Gate B regression
        run: |
          PYTHONPATH=src python scripts/audit_spec_v2.py --output /tmp/gate_b_v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/gate_b_v2.json').read_text())
          assert report['raw_state_combinations'] == 62208
          assert report['valid_state_combinations'] == 41472
          assert report['gate_verdict'] == 'GATE B — PASS'
          assert report['coverage']['conflicts'] == 0
          assert report['coverage']['fallback_count'] == 0
          assert report['coverage']['unreachable_matching_rules'] == []
          assert report['determinism']['pass'] is True
          assert report['invariants']['pass'] is True
          assert report['counterfactual']['pass'] is True
          assert report['temporal']['pass'] is True
          assert report['traceability']['pass'] is True
          PY
          test "$(PYTHONPATH=src python scripts/decide_gate_b_v2.py --evidence /tmp/gate_b_v2.json)" = "GATE B — PASS"

      - name: Deterministically regenerate Gate-C benchmark twice
        run: |
          rm -rf /tmp/gate-c-a /tmp/gate-c-b data/benchmark_v2
          PYTHONPATH=src python scripts/generate_benchmark_v2.py --output-dir /tmp/gate-c-a
          PYTHONPATH=src python scripts/generate_benchmark_v2.py --output-dir /tmp/gate-c-b
          diff -ru /tmp/gate-c-a /tmp/gate-c-b
          PYTHONPATH=src python scripts/generate_benchmark_v2.py --output-dir data/benchmark_v2
      - name: Audit Gate-C provenance diversity leakage relations and splits
        run: |
          PYTHONPATH=src python scripts/run_gate_c_audit.py --output reports/gate_c_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/gate_c_report.json').read_text())
          assert report['ground_truth_provenance']['manual_gold_findings'] == 0
          assert report['ground_truth_provenance']['llm_gold_findings'] == 0
          assert report['ground_truth_provenance']['oracle_mismatch_findings'] == 0
          assert report['leakage']['forbidden_metadata_findings'] == []
          assert report['split_integrity']['group_leakage'] == {}
          assert report['counterfactual']['violations'] == []
          assert report['temporal']['violations'] == []
          assert report['reproducibility']['deterministic_regeneration'] is True
          PY
          test "$(PYTHONPATH=src python scripts/decide_gate_c.py --evidence reports/gate_c_report.json)" = "GATE C — PASS"

      - name: Run Gate-D baselines and integrity controls twice
        run: |
          rm -rf gate_d/predictions reports/gate_d_report.json /tmp/gate-d-second
          PYTHONPATH=src python scripts/run_gate_d_v2.py --benchmark-root data/benchmark_v2 --output reports/gate_d_report.json --prediction-dir gate_d/predictions
          mkdir -p /tmp/gate-d-second
          PYTHONPATH=src python scripts/run_gate_d_v2.py --benchmark-root data/benchmark_v2 --output /tmp/gate-d-second/report.json --prediction-dir /tmp/gate-d-second/predictions
          diff -u reports/gate_d_report.json /tmp/gate-d-second/report.json
          diff -ru gate_d/predictions /tmp/gate-d-second/predictions
      - name: Assert Gate-D preregistered integrity criteria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/gate_d_report.json').read_text())
          assert report['gate_verdict'] == 'GATE D — PASS'
          assert report['baseline_source_boundary_violations'] == []
          assert all(report['failure_path_tests'].values())
          assert all(report['deterministic_prediction_match'].values())
          assert all(report['prediction_coverage'].values())
          assert all(report['evaluation_recomputation_match'].values())
          assert all(report['criteria'].values())
          assert report['controls']['row_order_shuffle_identical'] is True
          PY

      - name: Run complete regression and failure-path suite
        run: python -m pytest -q

      - name: Preserve Protocol-v1 dataset validators and negative evidence
        run: |
          PYTHONPATH=src python scripts/validate_dataset.py data/development/pilot_v0.jsonl
          PYTHONPATH=src python scripts/validate_dataset.py data/development/development_v1.jsonl --require-raw-context
          PYTHONPATH=src python scripts/audit_development_v1.py data/development/development_v1.jsonl data/development/development_v1.meta.jsonl

      - name: Upload Gate-D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-d-evidence-py${{ matrix.python-version }}
          path: |
            data/benchmark_v2/
            reports/gate_c_report.json
            reports/gate_d_report.json
            gate_d/predictions/
          if-no-files-found: warn

      - name: Verify Gate-E chronology and candidate-source immutability
        run: |
          git merge-base --is-ancestor cbb73cde89ac74f194c19d52e14379223ddc8c8a HEAD
          git merge-base --is-ancestor 554da731c962cdbf2ebd63cb65149f393e05b617 HEAD
          git diff --exit-code 554da731c962cdbf2ebd63cb65149f393e05b617 HEAD -- src/proactivity/candidate_v2.py
      - name: Run formal Gate-E evaluation twice
        run: |
          rm -rf gate_e/predictions reports/gate_e_report.json /tmp/gate-e-second
          PYTHONPATH=src python scripts/run_gate_e_v2.py --benchmark-root data/benchmark_v2 --output reports/gate_e_report.json --prediction-dir gate_e/predictions
          mkdir -p /tmp/gate-e-second
          PYTHONPATH=src python scripts/run_gate_e_v2.py --benchmark-root data/benchmark_v2 --output /tmp/gate-e-second/report.json --prediction-dir /tmp/gate-e-second/predictions
          diff -u reports/gate_e_report.json /tmp/gate-e-second/report.json
          diff -ru gate_e/predictions /tmp/gate-e-second/predictions
      - name: Assert Gate-E preregistered terminal criteria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/gate_e_report.json').read_text())
          assert report['gate_verdict'] == 'GATE E — PASS'
          assert report['candidate_source_boundary_violations'] == []
          assert report['search_budget'] == 6
          assert report['gate_f_protected_data'] == 'NOT_GENERATED'
          assert report['protected_test_isolation']['protected_candidate_rows_json_parsed'] == 0
          assert report['protected_test_isolation']['protected_private_rows_json_parsed'] == 0
          assert all(report['criteria'].values())
          PY
      - name: Upload Gate-E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-e-evidence-py${{ matrix.python-version }}
          path: |
            reports/gate_e_report.json
            gate_e/predictions/
            preregistration/gate_e_v2.md
            src/proactivity/candidate_v2.py
          if-no-files-found: warn
