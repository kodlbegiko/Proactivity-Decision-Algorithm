name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      # Protocol v1 remains executable historical evidence. It is not the primary gate.
      - name: Preserve Protocol-v1 deterministic artifacts
        run: |
          python scripts/generate_development_v1.py
          sha256sum -c data/development/development_v1.sha256
          python scripts/build_annotation_packets.py --validate-only
      - name: Preserve Protocol-v1 blocked verdict without fabricating humans
        run: |
          test "$(PYTHONPATH=src python scripts/decide_gate_b.py)" = "GATE B — BLOCKED_BY_INDEPENDENT_ANNOTATION"
          test ! -e annotations/raw/annotator_a_v1.csv
          test ! -e annotations/raw/annotator_b_v1.csv

      # Protocol v2 is the current primary specification-grounded research track.
      - name: Generate and hash-verify Protocol-v2 development benchmark
        run: |
          PYTHONPATH=src python scripts/generate_development_v2.py
          sha256sum -c data/development/development_v2.sha256
          PYTHONPATH=src python scripts/validate_development_v2.py
      - name: Exhaustively validate Protocol-v2 Gate B
        run: |
          PYTHONPATH=src python scripts/audit_spec_v2.py --output /tmp/gate_b_v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/gate_b_v2.json').read_text())
          assert report['raw_state_combinations'] == 62208
          assert report['valid_state_combinations'] == 41472
          assert report['gate_verdict'] == 'GATE B — PASS'
          assert report['coverage']['conflicts'] == 0
          assert report['coverage']['fallback_count'] == 0
          assert report['coverage']['unreachable_matching_rules'] == []
          assert report['determinism']['pass'] is True
          assert report['invariants']['pass'] is True
          assert report['counterfactual']['pass'] is True
          assert report['temporal']['pass'] is True
          assert report['traceability']['pass'] is True
          PY
          test "$(PYTHONPATH=src python scripts/decide_gate_b_v2.py --evidence /tmp/gate_b_v2.json)" = "GATE B — PASS"
      - name: Run complete regression and failure-path suite
        run: python -m pytest -q

      - name: Preserve Protocol-v1 dataset validators and negative evidence
        run: |
          PYTHONPATH=src python scripts/validate_dataset.py data/development/pilot_v0.jsonl
          PYTHONPATH=src python scripts/validate_dataset.py data/development/development_v1.jsonl --require-raw-context
          PYTHONPATH=src python scripts/audit_development_v1.py data/development/development_v1.jsonl data/development/development_v1.meta.jsonl
