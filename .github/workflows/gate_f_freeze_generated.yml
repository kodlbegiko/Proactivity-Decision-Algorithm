name: gate-f-freeze-generated

on:
  push:
    branches:
      - research/proactivity-protected-v2
    paths:
      - .github/workflows/gate_f_freeze_generated.yml

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Python 3.10 protected artifact from frozen generation run
        uses: actions/download-artifact@v4
        with:
          name: gate-f-generated-py3.10
          path: /tmp/gf310
          run-id: 31880132838
          github-token: ${{ github.token }}

      - name: Download Python 3.11 protected artifact from frozen generation run
        uses: actions/download-artifact@v4
        with:
          name: gate-f-generated-py3.11
          path: /tmp/gf311
          run-id: 31880132838
          github-token: ${{ github.token }}

      - name: Download Python 3.12 protected artifact from frozen generation run
        uses: actions/download-artifact@v4
        with:
          name: gate-f-generated-py3.12
          path: /tmp/gf312
          run-id: 31880132838
          github-token: ${{ github.token }}

      - name: Verify cross-version byte identity and frozen hashes
        run: |
          diff -ru /tmp/gf310 /tmp/gf311
          diff -ru /tmp/gf310 /tmp/gf312
          test "$(sha256sum /tmp/gf310/protected_inputs_v2.jsonl | awk '{print $1}')" = "8817cef5026a2e118d3f850653cd400a06316584510922c89c94fed79a16b971"
          test "$(sha256sum /tmp/gf310/protected_labels_v2.jsonl | awk '{print $1}')" = "21f6b4ba7843f3d90f269944a3a675ba7428edf1baece5ac6472e2196133c332"
          test "$(sha256sum /tmp/gf310/protected_private_v2.jsonl | awk '{print $1}')" = "fb9f819dd9020951ec4145efafa5e78088cadee1ad3c07b4c734a88dd6b7c9a5"
          test "$(sha256sum /tmp/gf310/generation_summary_v2.json | awk '{print $1}')" = "c5b325075d67a4c7fb81cff63d228dbe33df1e3dcfaf9b0873320385efb4725b"

      - name: Freeze generated bytes in repository without regeneration
        run: |
          cp /tmp/gf310/protected_inputs_v2.jsonl gate_f/protected_inputs_v2.jsonl
          cp /tmp/gf310/protected_labels_v2.jsonl gate_f/protected_labels_v2.jsonl
          cp /tmp/gf310/protected_private_v2.jsonl gate_f/protected_private_v2.jsonl
          cp /tmp/gf310/generation_summary_v2.json gate_f/generation_summary_v2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gate_f/protected_inputs_v2.jsonl gate_f/protected_labels_v2.jsonl gate_f/protected_private_v2.jsonl gate_f/generation_summary_v2.json
          git diff --cached --exit-code && { echo "No protected files to freeze"; exit 1; } || true
          git commit -m "freeze Gate F protected data from generation run 31880132838"
          git push origin HEAD:research/proactivity-protected-v2
