name: Candidate-v5 One-Time Source Correction

on:
  push:
    branches:
      - research/candidate-v5-semantic-generalization

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'add one-time Candidate-v5 pre-data source correction workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v5-semantic-generalization
          fetch-depth: 0
      - name: Correct pre-generation symbol typo only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/proactivity/candidate_v5_data.py')
          text=p.read_text(encoding='utf-8')
          old='VALUE: dict[str, tuple[Any, ...]] = {'
          new='VALUES: dict[str, tuple[Any, ...]] = {'
          assert text.count(old)==1
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git diff --check
          git diff -- src/proactivity/candidate_v5_data.py
      - name: Commit source-only correction before any dataset exists
        run: |
          test ! -e data/candidate_v5_development/manifest.json
          git config user.name candidate-v5-development-bot
          git config user.email candidate-v5-development-bot@users.noreply.github.com
          git add src/proactivity/candidate_v5_data.py
          git commit -m 'correct Candidate-v5 generator symbol typo before data generation [skip ci]'
          git push origin HEAD:research/candidate-v5-semantic-generalization
