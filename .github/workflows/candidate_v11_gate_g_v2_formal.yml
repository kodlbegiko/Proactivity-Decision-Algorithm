name: Candidate-v11 Gate G v2 Formal

on:
  push:
    branches:
      - research/candidate-v11-gate-g-v2-independent-requalification
    paths:
      - gate_g_v11_rq2/preregistration.json

permissions:
  contents: read

jobs:
  preflight:
    name: formal-preflight-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Materialize deterministic repository fixtures
        run: |
          python scripts/generate_development_v1.py
          sha256sum -c data/development/development_v1.sha256
          PYTHONPATH=src python scripts/generate_development_v2.py
          sha256sum -c data/development/development_v2.sha256
          PYTHONPATH=src python scripts/validate_development_v2.py
          rm -rf data/benchmark_v2
          PYTHONPATH=src python scripts/generate_benchmark_v2.py --output-dir data/benchmark_v2
          PYTHONPATH=.:src python -m benchmark_v11.run_qualification --generate-only
          PYTHONPATH=.:src python -m benchmark_v11.run_holdouts --generate-only
      - name: Full repository tests including Gate G v2 scientific preflight
        run: PYTHONPATH=.:src pytest -q
      - name: Frozen candidate interface/freeze verification
        run: PYTHONPATH=.:src python -m gate_g_v11_rq2.preflight

  formal:
    name: one-shot-formal-gate-g-v2
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Execute atomic formal Gate G v2
        env:
          PYTHONPATH: .:src
        run: python -m gate_g_v11_rq2.run_formal
      - name: Emit aggregate terminal evidence
        if: always()
        run: |
          test -f gate_g_v11_rq2_out/reports/candidate_v11_gate_g_v2/terminal.json && cat gate_g_v11_rq2_out/reports/candidate_v11_gate_g_v2/terminal.json || true
          test -f gate_g_v11_rq2_out/audit_report.json && cat gate_g_v11_rq2_out/audit_report.json || true
          test -f gate_g_v11_rq2_out/dataset_manifest.json && cat gate_g_v11_rq2_out/dataset_manifest.json || true
      - name: Upload aggregate Gate G v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-v11-gate-g-v2-aggregate-evidence
          path: gate_g_v11_rq2_out/
          if-no-files-found: error
