name: Candidate-v7 CI
on:
  push:
    branches: [research/candidate-v7-safety-first-generalization]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONPATH: .:src
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile candidate_v7/model.py candidate_v7/safety_gate.py candidate_v7/evaluation.py candidate_v7/mission.py candidate_v7/protected_generator.py benchmark_v7/generator.py
      - run: pytest -q tests/test_candidate_v7.py tests/test_specification_v2.py
