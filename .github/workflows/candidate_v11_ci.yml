name: Candidate v11 CI

on:
  push:
    branches:
      - research/candidate-v11-semantic-abstraction-contradiction-reasoning
  pull_request:
    branches:
      - research/candidate-v10-semantic-evidence-generalization-recovery

jobs:
  candidate-v11:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Candidate-v11
        run: python -m py_compile candidate_v11/*.py benchmark_v11/*.py
      - name: Candidate-v11 unit tests
        run: python -m pytest -q tests/test_candidate_v11.py
