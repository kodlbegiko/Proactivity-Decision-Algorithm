name: candidate-v8-ci
on:
  push:
    branches: [research/candidate-v8-balanced-autonomy-recovery]
  pull_request:
    paths: ['candidate_v8/**', 'benchmark_v8/**', 'tests/test_candidate_v8.py', 'gate_recovery_v8/**']
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m py_compile candidate_v8/*.py benchmark_v8/*.py
      - run: python -m pytest -q tests/test_candidate_v8.py
