name: Candidate-v7 Autonomous Mission
on:
  push:
    branches: [research/candidate-v7-safety-first-generalization]
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONPATH: .:src
jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Guard and unit tests
        run: |
          python -m py_compile candidate_v7/model.py candidate_v7/safety_gate.py candidate_v7/evaluation.py candidate_v7/mission.py candidate_v7/protected_generator.py benchmark_v7/generator.py
          pytest -q tests/test_candidate_v7.py tests/test_specification_v2.py
      - name: Execute mission to legal terminal
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gate_recovery_v7/fresh_confirmatory_terminal.json ]]; then
            echo 'Terminal already exists; refusing any rerun.'
            exit 0
          fi
          git config user.name 'candidate-v7-mission-bot'
          git config user.email 'candidate-v7-mission-bot@users.noreply.github.com'

          set +e
          python scripts/run_candidate_v7.py develop
          DEV_RC=$?
          set -e
          if [[ $DEV_RC -ne 0 ]]; then
            if [[ ! -f gate_recovery_v7/fresh_confirmatory_terminal.json ]]; then
              echo 'Development runner failed without a legal terminal; treating as infrastructure/code failure.'
              exit "$DEV_RC"
            fi
            git add -A data/candidate_v7_development reports/candidate_v7 gate_recovery_v7 candidate_v7/frozen_config.json 2>/dev/null || true
            git commit -m 'candidate-v7: record validation terminal'
            git push origin HEAD:${GITHUB_REF_NAME}
            exit 0
          fi

          git add candidate_v7/frozen_config.json data/candidate_v7_development/train.jsonl data/candidate_v7_development/validation.jsonl reports/candidate_v7 gate_recovery_v7/candidate_freeze.json
          git commit -m 'candidate-v7: freeze candidate before holdouts'
          git push origin HEAD:${GITHUB_REF_NAME}
          CANDIDATE_FREEZE_SHA=$(git rev-parse HEAD)
          git ls-remote --exit-code origin "refs/heads/${GITHUB_REF_NAME}" | grep -q "$CANDIDATE_FREEZE_SHA"
          echo "candidate_freeze_sha=$CANDIDATE_FREEZE_SHA"

          set +e
          python scripts/run_candidate_v7.py holdouts --candidate-freeze-sha "$CANDIDATE_FREEZE_SHA"
          HOLDOUT_RC=$?
          set -e
          if [[ $HOLDOUT_RC -ne 0 && ! -f gate_recovery_v7/fresh_confirmatory_terminal.json ]]; then
            echo 'Holdout runner failed without a legal terminal; no tuning or rerun is allowed automatically.'
            exit "$HOLDOUT_RC"
          fi
          git add data/candidate_v7_development reports/candidate_v7 gate_recovery_v7
          git commit -m 'candidate-v7: record frozen development holdouts'
          git push origin HEAD:${GITHUB_REF_NAME}
          if [[ $HOLDOUT_RC -ne 0 ]]; then
            echo 'Development terminal reached; protected evaluation prohibited.'
            exit 0
          fi

          python scripts/run_candidate_v7.py prepare-protected --candidate-freeze-sha "$CANDIDATE_FREEZE_SHA"
          git add preregistration/candidate_v7_fresh_confirmatory.md gate_recovery_v7/protected_protocol_freeze.json gate_recovery_v7/protected_generator_freeze.json
          git commit -m 'candidate-v7: freeze protected protocol and generator'
          git push origin HEAD:${GITHUB_REF_NAME}
          PROTOCOL_SHA=$(git rev-parse HEAD)
          git ls-remote --exit-code origin "refs/heads/${GITHUB_REF_NAME}" | grep -q "$PROTOCOL_SHA"
          echo "protocol_sha=$PROTOCOL_SHA"

          set +e
          python scripts/run_candidate_v7.py protected --candidate-freeze-sha "$CANDIDATE_FREEZE_SHA" --protocol-commit "$PROTOCOL_SHA"
          PROTECTED_RC=$?
          set -e
          if [[ ! -f gate_recovery_v7/fresh_confirmatory_terminal.json ]]; then
            mkdir -p gate_recovery_v7 reports/candidate_v7
            printf '%s\n' '{"terminal_state":"FRESH CONFIRMATORY INVALID — EVALUATION INTEGRITY FAILURE","reason":"protected execution terminated after one-shot start without a complete terminal artifact"}' > gate_recovery_v7/fresh_confirmatory_terminal.json
            printf '%s\n' '# Candidate-v7 Terminal Report' '' '## Terminal State' '`FRESH CONFIRMATORY INVALID — EVALUATION INTEGRITY FAILURE`' '' '## Known Failures' '- protected execution terminated after one-shot start without a complete terminal artifact; no rerun permitted.' '' '## Next Critical Path' 'Precise integrity failure must be investigated in a new lineage/protocol; Candidate-v7 protected result cannot be rescued.' > reports/candidate_v7/terminal_report.md
          fi
          git add -A data/candidate_v7_fresh_confirmatory reports/candidate_v7 gate_recovery_v7
          git commit -m 'candidate-v7: finalize one-shot protected terminal evidence'
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "protected_rc=$PROTECTED_RC"
