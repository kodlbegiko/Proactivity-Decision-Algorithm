name: Candidate v4 recovery qualification

on:
  push:
    branches:
      - research/candidate-v4-generalization-recovery
  pull_request:
    branches:
      - main
    paths:
      - 'src/proactivity/candidate_v4.py'
      - 'src/proactivity/recovery_v4_data.py'
      - 'scripts/run_recovery_v4.py'
      - 'tests/test_candidate_v4.py'
      - 'preregistration/recovery_v4.md'
      - '.github/workflows/candidate_v4_recovery.yml'

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce protected-evidence quarantine
        shell: bash
        run: |
          set -euo pipefail
          BASE='0fd05b6ac9e3f451ed710f2f37ee845dedad1df7'
          git cat-file -e "${BASE}^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/v4_changed_paths.txt
          if grep -E '^(data/candidate_v3_confirmatory/|results/candidate_v3_confirmatory/|docs/candidate_v3_confirmatory_terminal_report\.md$)' /tmp/v4_changed_paths.txt; then
            echo 'Candidate-v4 changed a quarantined Candidate-v3 confirmatory path.' >&2
            exit 42
          fi
          echo 'Protected-evidence quarantine: PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Candidate-v4 unit and property tests
        run: python -m pytest tests/test_candidate_v4.py -q

      - name: Run preregistered bounded search and qualification
        run: python scripts/run_recovery_v4.py --assert-pass --output-dir results/candidate_v4_recovery_ci

      - name: Upload development evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-v4-recovery-py${{ matrix.python-version }}
          path: results/candidate_v4_recovery_ci/
          if-no-files-found: error
