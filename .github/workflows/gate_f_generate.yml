name: gate-f-generate

on:
  push:
    branches:
      - research/proactivity-protected-v2
    paths:
      - gate_f/generator_manifest_v2.json
      - scripts/generate_gate_f_v2.py
      - .github/workflows/gate_f_generate.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Verify frozen Gate-E scientific dependencies
        run: |
          test "$(sha256sum spec/proactivity_policy_v2.json | awk '{print $1}')" = "ea06eeb85ffa375740e778d273b57d79e7f4f96d0eb68eb74ed2ef9df6d827a4"
          test "$(sha256sum src/proactivity/specification/oracle.py | awk '{print $1}')" = "11ec7557d4809b18e1c414d9a3b0eaf95ad93ac7f771da11ed0cf4c3043bed2f"
          test "$(sha256sum src/proactivity/candidate_v2.py | awk '{print $1}')" = "78d4cbdf6190cd8d87927d4efbce63ef29e3dacb902c44c1b3d5004a290aae5b"
          git diff --exit-code 554da731c962cdbf2ebd63cb65149f393e05b617 HEAD -- src/proactivity/candidate_v2.py

      - name: Enforce candidate-blind generator source boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/generate_gate_f_v2.py").read_text(encoding="utf-8").lower()
          forbidden = (
              "proactivity.candidate",
              "candidate_v2",
              "gate_e",
              "reports/gate_e",
              "gate_e/predictions",
              "confusion_matrix",
          )
          findings = [token for token in forbidden if token in source]
          assert findings == [], findings
          PY

      - name: Verify frozen generator source hash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("gate_f/generator_manifest_v2.json").read_text())
          actual = hashlib.sha256(Path("scripts/generate_gate_f_v2.py").read_bytes()).hexdigest()
          assert actual == manifest["generator_source_sha256"], (actual, manifest["generator_source_sha256"])
          assert manifest["status"] == "FROZEN_BEFORE_PROTECTED_GENERATION"
          assert manifest["candidate_blind"] is True
          PY

      - name: Generate protected set twice deterministically
        run: |
          rm -rf /tmp/gate-f-a /tmp/gate-f-b
          PYTHONPATH=src python scripts/generate_gate_f_v2.py --output-dir /tmp/gate-f-a
          PYTHONPATH=src python scripts/generate_gate_f_v2.py --output-dir /tmp/gate-f-b
          diff -ru /tmp/gate-f-a /tmp/gate-f-b

      - name: Validate protected generation criteria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/gate-f-a")
          summary = json.loads((root / "generation_summary_v2.json").read_text())
          assert summary["total"] == 120
          assert summary["action_counts"] == {"ACT":20,"ASK":20,"IGNORE":20,"NOTIFY":20,"SUGGEST":20,"WAIT":20}
          assert summary["domain_counts"] == {"communication":20,"device":20,"scheduling":20,"study":20,"travel":20,"work":20}
          assert summary["rendering_family_counts"] == {"0":30,"1":30,"2":30,"3":30}
          assert summary["counterfactual_pair_count"] == 24
          assert len(summary["counterfactual_fields"]) >= 8
          assert summary["candidate_runtime_access"] is False
          assert summary["candidate_source_used_for_generation"] is False
          PY

      - name: Upload protected generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-f-generated-py${{ matrix.python-version }}
          path: /tmp/gate-f-a/
          if-no-files-found: error
