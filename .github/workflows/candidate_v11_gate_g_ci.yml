name: Candidate v11 Gate G Independent External Validity

on:
  push:
    branches:
      - research/candidate-v11-gate-g-independent-external-validity
    paths:
      - gate_g_v11/evaluation_authorization.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate-g:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Gate G
        run: python -m py_compile gate_g_v11/*.py
      - name: Test repository
        run: PYTHONPATH=.:src python -m pytest -q
      - name: Execute frozen Gate G once plus deterministic replay
        run: PYTHONPATH=.:src python -m gate_g_v11.run_gate_g
      - name: Independent Gate G audit
        run: PYTHONPATH=.:src python gate_g_v11/audit_gate_g.py
      - name: Persist terminal evidence from canonical Python 3.12 job
        if: matrix.python-version == '3.12'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gate_g_v11/dataset_manifest.json \
                  gate_g_v11/distribution_independence_report.json \
                  gate_g_v11/reproducibility_report.json \
                  gate_g_v11/audit_report.json \
                  reports/candidate_v11_gate_g/
          if git diff --cached --quiet; then
            echo "No terminal evidence changes to commit"
          else
            git commit -m "candidate-v11: record Gate G terminal evidence"
            git push origin HEAD:research/candidate-v11-gate-g-independent-external-validity
          fi
