name: Candidate-v7 Independent Requalification (V7R)

on:
  push:
    branches:
      - research/candidate-v7-independent-requalification
    paths:
      - "evaluation/v7r/**"
      - "tests/test_v7r.py"
      - ".github/workflows/candidate_v7_requalification.yml"

permissions:
  contents: write

concurrency:
  group: candidate-v7-independent-requalification
  cancel-in-progress: false

jobs:
  v7r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout full research history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/candidate-v7-independent-requalification

      - name: Materialize frozen V7R runtime bundle
        shell: bash
        run: |
          cat evaluation/v7r/runtime_bundle.b64.part* | base64 --decode > /tmp/v7r_runtime.tar.gz
          echo "8f4464ba7d127732436e1e3e350f8a8b0f0daf6e391daf516edc7baa3267a9d5  /tmp/v7r_runtime.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v7r_runtime.tar.gz -C .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare deterministic repository regression fixtures
        shell: bash
        run: |
          python scripts/generate_development_v1.py
          sha256sum -c data/development/development_v1.sha256
          python scripts/build_annotation_packets.py --validate-only
          PYTHONPATH=src python scripts/generate_development_v2.py
          sha256sum -c data/development/development_v2.sha256
          PYTHONPATH=src python scripts/validate_development_v2.py
          rm -rf data/benchmark_v2
          PYTHONPATH=src python scripts/generate_benchmark_v2.py --output-dir data/benchmark_v2

      - name: Run full repository test suite before protected realization
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee .v7r_tests.txt

      - name: Execute frozen V7R qualification
        run: |
          python -m evaluation.v7r.orchestrate --repo . --work .v7r_work

      - name: Preserve audit-only protected evidence
        uses: actions/upload-artifact@v4
        with:
          name: v7r-protected-audit-evidence
          path: |
            .v7r_work/protected
            .v7r_work/predictions
            .v7r_work/scores
            .v7r_work/artifacts/v7r
            .v7r_tests.txt
          if-no-files-found: error
          retention-days: 90

      - name: Commit terminal evidence artifacts
        shell: bash
        run: |
          mkdir -p artifacts/v7r
          cp -R .v7r_work/artifacts/v7r/. artifacts/v7r/
          cp .v7r_tests.txt artifacts/v7r/TESTS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/v7r
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
            exit 0
          fi
          git commit -m "v7r: freeze terminal requalification evidence [skip ci]"
          git push origin HEAD:research/candidate-v7-independent-requalification
